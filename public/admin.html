<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Konoha Network</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d1117 0%, #1a0f00 50%, #111827 100%);
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(249, 115, 22, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #f97316; /* Orange Konoha */
            --primary-hover: #ea580c;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Chakra Glow Effect */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .login-box h2 {
            color: var(--text-primary);
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 700;
        }

        .login-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .login-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        .login-box button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
        }

        /* Admin Dashboard */
        .dashboard {
            display: none;
        }

        .header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 24px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
        }

        .header .admin-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #adminName {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }

        .logout-btn {
            padding: 10px 18px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .number {
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
        }

        .users-section {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-header h2 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
        }

        .refresh-btn {
            padding: 10px 18px;
            background: rgba(249, 115, 22, 0.15);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: var(--primary);
            color: white;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(13, 17, 23, 0.6);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            color: var(--text-secondary);
            font-size: 14px;
        }

        td:first-child {
            color: var(--text-primary);
            font-weight: 500;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .status.pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status.approved {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status.rejected {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .traffic-info {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .traffic-info span {
            font-weight: 600;
            color: var(--text-primary);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-1px);
        }

        .approve-btn {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .approve-btn:hover:not(:disabled) {
            background: var(--success);
            color: white;
        }

        .reject-btn {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .reject-btn:hover:not(:disabled) {
            background: var(--danger);
            color: white;
        }

        .delete-btn {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-secondary);
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .delete-btn:hover:not(:disabled) {
            background: var(--text-secondary);
            color: #0d1117;
        }

        .action-btn:disabled {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.2);
            border-color: transparent;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            stroke: var(--text-secondary);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h2>🍥 Admin Login Konoha</h2>
            <form id="loginForm">
                <input type="password" id="adminPassword" placeholder="Masukkan password admin" required>
                <button type="submit">Login</button>
            </form>
            <div class="message" id="loginMessage"></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="container dashboard" id="dashboard">
        <div class="header">
            <h1>🍥 Admin Panel - Konoha Network</h1>
            <div class="admin-info">
                <span id="adminName">Admin</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="number" id="pendingUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Approved</h3>
                <div class="number" id="approvedUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Rejected</h3>
                <div class="number" id="rejectedUsers">0</div>
            </div>
        </div>

        <div class="users-section">
            <div class="section-header">
                <h2>Daftar User Shinobi</h2>
                <button class="refresh-btn" onclick="loadUsers()">🔄 Refresh</button>
            </div>

            <div class="message" id="message"></div>

            <div class="table-container">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Tanggal</th>
                            <th>Penggunaan Traffic</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <p>Belum ada user terdaftar</p>
            </div>

            <div class="loading" id="loading" style="display: none;">
                Memuat data...
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin.includes('vercel.app') 
            ? window.location.origin 
            : 'https://henok-lake.vercel.app';

        let isAdminLoggedIn = false;
        let adminName = 'Admin';

        function formatBytes(bytes) {
            if (!bytes || bytes == 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        if (localStorage.getItem('adminLoggedIn') === 'true') {
            isAdminLoggedIn = true;
            adminName = localStorage.getItem('adminName') || 'Admin';
            showDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;

            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    isAdminLoggedIn = true;
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminName', adminName);
                    showDashboard();
                } else {
                    showLoginMessage(data.message, 'error');
                }
            } catch (error) {
                showLoginMessage('Terjadi kesalahan. Silakan coba lagi.', 'error');
            }
        });

        function showLoginMessage(text, type) {
            const message = document.getElementById('loginMessage');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';

            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }

        function showDashboard() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('adminName').textContent = adminName;
            loadUsers();
        }

        function logout() {
            isAdminLoggedIn = false;
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminName');
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        async function loadUsers() {
            const loading = document.getElementById('loading');
            const tableBody = document.getElementById('usersTableBody');
            const emptyState = document.getElementById('emptyState');

            loading.style.display = 'block';
            tableBody.innerHTML = '';
            emptyState.style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/api/users`);
                const data = await response.json();

                if (data.success) {
                    const users = data.users;
                    
                    document.getElementById('totalUsers').textContent = users.length;
                    document.getElementById('pendingUsers').textContent = users.filter(u => u.status === 'pending').length;
                    document.getElementById('approvedUsers').textContent = users.filter(u => u.status === 'approved').length;
                    document.getElementById('rejectedUsers').textContent = users.filter(u => u.status === 'rejected').length;

                    if (users.length === 0) {
                        emptyState.style.display = 'block';
                    } else {
                        users.forEach(user => {
                            const bytesIn = formatBytes(user.bytesIn || 0);
                            const bytesOut = formatBytes(user.bytesOut || 0);
                            const uptime = user.uptime || 'Off';

                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${user.name}</td>
                                <td>${user.email}</td>
                                <td>${user.username}</td>
                                <td><span class="status ${user.status}">${user.status}</span></td>
                                <td>${new Date(user.timestamp).toLocaleDateString('id-ID')}</td>
                                <td>
                                    <div class="traffic-info">
                                        ⏱️ Uptime: <span>${uptime}</span><br>
                                        ⬇️ Download: <span>${bytesOut}</span> | ⬆️ Upload: <span>${bytesIn}</span>
                                    </div>
                                </td>
                                <td>
                                    <div class="actions">
                                        <button class="action-btn approve-btn" 
                                            onclick="approveUser('${user.username}')" 
                                            ${user.status !== 'pending' ? 'disabled' : ''}>
                                            ✓ Approve
                                        </button>
                                        <button class="action-btn reject-btn" 
                                            onclick="rejectUser('${user.username}')"
                                            ${user.status !== 'pending' ? 'disabled' : ''}>
                                            ✗ Reject
                                        </button>
                                        <button class="action-btn delete-btn" 
                                            onclick="deleteUser('${user.username}')">
                                            🗑 Delete
                                        </button>
                                    </div>
                                </td>
                            `;
                            tableBody.appendChild(row);
                        });
                    }
                }
            } catch (error) {
                showMessage('Gagal memuat data user', 'error');
            } finally {
                loading.style.display = 'none';
            }
        }

        async function approveUser(username) {
            if (!confirm(`Approve user ${username}?`)) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/approve`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, adminName })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`User ${username} berhasil diapprove`, 'success');
                    loadUsers();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Gagal approve user', 'error');
            }
        }

        async function rejectUser(username) {
            if (!confirm(`Reject user ${username}?`)) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/reject`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, adminName })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`User ${username} berhasil direject`, 'success');
                    loadUsers();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Gagal reject user', 'error');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Hapus user ${username}?`)) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/users/${username}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`User ${username} berhasil dihapus`, 'success');
                    loadUsers();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Gagal menghapus user', 'error');
            }
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';

            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }

        setInterval(() => {
            if (isAdminLoggedIn) {
                loadUsers();
            }
        }, 30005);
    </script>
</body>
</html>
